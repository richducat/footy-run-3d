<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footy Run 3D</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at top, #1f2937, #030712 55%);
        color: #fff;
      }

      #score {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 0.35rem 0.75rem;
        background: rgba(3, 7, 18, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        font-size: 1rem;
        letter-spacing: 0.02em;
        z-index: 10;
        backdrop-filter: blur(8px);
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.75));
        z-index: 20;
      }

      #overlay .panel {
        width: min(420px, 90vw);
        text-align: center;
        padding: 2.5rem 2rem;
        background: rgba(8, 47, 73, 0.85);
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }

      #overlay h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #overlayMessage {
        margin: 0 auto 1.5rem;
        max-width: 30ch;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.85);
      }

      #startBtn {
        width: 100%;
        padding: 1rem 2rem;
        font-size: 1.1rem;
        background: linear-gradient(135deg, #ef4444, #f97316);
        border: none;
        border-radius: 999px;
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        font-weight: 600;
        box-shadow: 0 10px 25px rgba(249, 115, 22, 0.35);
      }

      #startBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 35px rgba(249, 115, 22, 0.5);
      }

      .hint {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.65);
      }

      canvas {
        display: block;
      }

      @media (max-width: 640px) {
        #score {
          font-size: 0.9rem;
          left: 50%;
          transform: translateX(-50%);
        }

        #overlay .panel {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="score">Score: 0 | Best: 0</div>
    <div id="overlay">
      <div class="panel">
        <h1>Footy Run 3D</h1>
        <p id="overlayMessage">
          Dodge training cones, leap over tackle dummies, and stay on your lane as
          the tempo rises. How long can you keep the drill alive?
        </p>
        <button id="startBtn">Start Run</button>
        <p class="hint">
          Desktop: ← → to move &nbsp;•&nbsp; ↑ / Space to jump &nbsp;•&nbsp; Mobile:
          swipe to move or jump
        </p>
      </div>
    </div>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

      let scene, camera, renderer, player;
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const overlayMessage = document.getElementById('overlayMessage');
      const scoreEl = document.getElementById('score');

      const obstacles = [];
      const laneMarkers = [];
      const laneX = [-2, 0, 2];

      const PLAYER_Z = 0;
      const LANE_MARKER_COUNT = 16;
      const LANE_MARKER_SPACING = 5;
      const BASE_SPEED = 7;
      const MAX_SPEED = 18;
      const MIN_SPAWN_INTERVAL = 0.45;

      let currentLane = 1;
      let speed = BASE_SPEED;
      let gameOver = false;
      let gameRunning = false;
      let score = 0;
      let jumpVelocity = 0;
      let isJumping = false;
      const gravity = 1.2;
      const jumpStrength = 12;
      let lastTime = 0;
      let animationRunning = false;
      let distanceTravelled = 0;
      let highScore = 0;
      let spawnTimer = 0;
      let spawnInterval = 1;

      function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0b1121, 8, 55);

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        scene.add(dirLight);

        const ambLight = new THREE.HemisphereLight(0xddeeff, 0x060910, 0.45);
        scene.add(ambLight);

        createEnvironment();
        createLaneMarkers();

        player = new THREE.Mesh(
          new THREE.SphereGeometry(0.5, 24, 24),
          new THREE.MeshStandardMaterial({
            color: 0xffd166,
            metalness: 0.15,
            roughness: 0.3,
            emissive: 0x291800,
            emissiveIntensity: 0.3,
          })
        );
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        player.castShadow = true;
        scene.add(player);

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      function createEnvironment() {
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(400, 24),
          new THREE.MeshStandardMaterial({ color: 0x045229, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -120;
        ground.receiveShadow = true;
        scene.add(ground);

        const midfieldLine = new THREE.Mesh(
          new THREE.PlaneGeometry(400, 0.15),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
        );
        midfieldLine.rotation.x = -Math.PI / 2;
        midfieldLine.position.set(0, 0.02, -120);
        scene.add(midfieldLine);

        const crowdMaterial = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
        const leftStand = new THREE.Mesh(new THREE.BoxGeometry(400, 10, 2), crowdMaterial);
        leftStand.position.set(-8, 5, -60);
        leftStand.rotation.y = Math.PI / 24;
        scene.add(leftStand);

        const rightStand = leftStand.clone();
        rightStand.position.x = 8;
        rightStand.rotation.y = -Math.PI / 24;
        scene.add(rightStand);

        const goalMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4, 16), goalMaterial);
        crossbar.rotation.z = Math.PI / 2;
        crossbar.position.set(0, 2.5, -12);
        scene.add(crossbar);

        [-1.5, 1.5].forEach((offset) => {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3, 16), goalMaterial);
          post.position.set(offset, 1.5, -12);
          scene.add(post);
        });

        const spotLightLeft = new THREE.SpotLight(0xffffff, 0.8, 80, Math.PI / 4, 0.6, 1);
        spotLightLeft.position.set(-8, 12, 10);
        const leftTarget = new THREE.Object3D();
        leftTarget.position.set(0, 0, -20);
        spotLightLeft.target = leftTarget;
        scene.add(leftTarget);
        scene.add(spotLightLeft);

        const spotLightRight = new THREE.SpotLight(0xffffff, 0.8, 80, Math.PI / 4, 0.6, 1);
        spotLightRight.position.set(8, 12, 10);
        const rightTarget = new THREE.Object3D();
        rightTarget.position.set(0, 0, -20);
        spotLightRight.target = rightTarget;
        scene.add(rightTarget);
        scene.add(spotLightRight);
      }

      function createLaneMarkers() {
        const markerGeo = new THREE.PlaneGeometry(0.4, 1.5);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < LANE_MARKER_COUNT; i++) {
          const marker = new THREE.Mesh(markerGeo, markerMat);
          marker.rotation.x = -Math.PI / 2;
          marker.position.set(0, 0.015, -i * LANE_MARKER_SPACING);
          laneMarkers.push(marker);
          scene.add(marker);
        }
      }

      function resetLaneMarkers() {
        laneMarkers.forEach((marker, index) => {
          marker.position.z = -index * LANE_MARKER_SPACING;
        });
      }

      function scrollLaneMarkers(deltaSeconds) {
        if (!laneMarkers.length) return;
        const travel = speed * deltaSeconds;
        const minZ = -LANE_MARKER_SPACING * (laneMarkers.length - 1);
        laneMarkers.forEach((marker) => {
          marker.position.z += travel;
          if (marker.position.z > PLAYER_Z) {
            marker.position.z = minZ;
          }
        });
      }

      function spawnObstacle() {
        const idx = Math.floor(Math.random() * 3);
        const isCone = Math.random() > 0.4;
        const obstacle = new THREE.Mesh(
          isCone
            ? new THREE.ConeGeometry(0.35, 1.3, 18)
            : new THREE.CylinderGeometry(0.25, 0.45, 1.4, 12),
          new THREE.MeshStandardMaterial({
            color: isCone ? 0xf97316 : 0xff4d6d,
            roughness: 0.6,
            emissive: 0x1f0a0a,
            emissiveIntensity: 0.35,
          })
        );
        obstacle.position.set(laneX[idx], 0.4, -50);
        obstacle.laneIndex = idx;
        obstacle.castShadow = true;
        obstacle.userData.speedFactor = 1 + Math.random() * 0.35;
        obstacles.push(obstacle);
        scene.add(obstacle);
      }

      function updateObstacles(deltaSeconds) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obstacle = obstacles[i];
          const travel = speed * obstacle.userData.speedFactor * deltaSeconds * 1.8;
          obstacle.position.z += travel;
          if (obstacle.position.z > 5) {
            scene.remove(obstacle);
            obstacles.splice(i, 1);
          } else if (
            gameRunning &&
            obstacle.laneIndex === currentLane &&
            Math.abs(obstacle.position.z - PLAYER_Z) < 0.8 &&
            player.position.y < 1
          ) {
            endGame(
              `You clipped a defender! Final score: <strong>${score}</strong>.<br />Your best drill: <strong>${Math.max(
                highScore,
                score
              )}</strong>.`
            );
          }
        }
      }

      function animate(timestamp) {
        requestAnimationFrame(animate);
        const deltaSeconds = lastTime ? (timestamp - lastTime) / 1000 : 0;
        lastTime = timestamp;

        if (gameRunning && deltaSeconds) {
          scrollLaneMarkers(deltaSeconds);
          if (isJumping) {
            player.position.y += jumpVelocity * deltaSeconds;
            jumpVelocity -= gravity * deltaSeconds;
            if (player.position.y <= 0.5) {
              player.position.y = 0.5;
              isJumping = false;
              jumpVelocity = 0;
            }
          }

          spawnTimer += deltaSeconds;
          if (spawnTimer >= spawnInterval) {
            spawnObstacle();
            spawnTimer = 0;
            spawnInterval = Math.max(MIN_SPAWN_INTERVAL, spawnInterval - 0.01);
          }

          updateObstacles(deltaSeconds);

          speed = Math.min(MAX_SPEED, speed + deltaSeconds * 0.4);
          distanceTravelled += speed * deltaSeconds * 0.5;
          score = Math.floor(distanceTravelled);
          updateScoreboard();
        }

        renderer.render(scene, camera);
      }

      function startGame() {
        while (obstacles.length) {
          const obstacle = obstacles.pop();
          scene.remove(obstacle);
        }
        score = 0;
        gameOver = false;
        gameRunning = true;
        currentLane = 1;
        jumpVelocity = 0;
        isJumping = false;
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        resetLaneMarkers();
        lastTime = 0;
        speed = BASE_SPEED;
        spawnTimer = 0;
        spawnInterval = 1;
        distanceTravelled = 0;
        updateScoreboard();
        overlay.style.display = 'none';
        overlayMessage.innerHTML =
          'Dodge training cones, leap over tackle dummies, and stay on your lane as the tempo rises. How long can you keep the drill alive?';

        if (!animationRunning) {
          animationRunning = true;
          requestAnimationFrame(animate);
        }
      }

      function endGame(message) {
        gameRunning = false;
        gameOver = true;
        highScore = Math.max(highScore, score);
        updateScoreboard();
        overlayMessage.innerHTML = message;
        overlay.style.display = 'flex';
        startBtn.textContent = 'Play Again';
      }

      function updateScoreboard() {
        scoreEl.textContent = `Score: ${score} | Best: ${highScore}`;
      }

      function moveLeft() {
        if (!gameRunning) return;
        if (currentLane > 0) {
          currentLane--;
          player.position.x = laneX[currentLane];
        }
      }

      function moveRight() {
        if (!gameRunning) return;
        if (currentLane < 2) {
          currentLane++;
          player.position.x = laneX[currentLane];
        }
      }

      function jump() {
        if (!gameRunning) return;
        if (!isJumping) {
          isJumping = true;
          jumpVelocity = jumpStrength;
        }
      }

      startBtn.addEventListener('click', startGame);

      window.addEventListener('keydown', (event) => {
        if (!gameRunning) return;
        if (event.key === 'ArrowLeft') {
          moveLeft();
        } else if (event.key === 'ArrowRight') {
          moveRight();
        } else if (event.key === 'ArrowUp' || event.key === ' ') {
          jump();
        }
      });

      let touchStartX;
      let touchStartY;

      window.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      });

      window.addEventListener('touchend', (event) => {
        if (!gameRunning) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.screenX - touchStartX;
        const deltaY = touch.screenY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX > 30) {
            moveRight();
          } else if (deltaX < -30) {
            moveLeft();
          }
        } else if (deltaY < -30) {
          jump();
        }
      });

      init();
    </script>
  </body>
</html>

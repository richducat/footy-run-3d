<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footy Run 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
        background: #111;
        color: #fff;
      }

      #score {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 1.2rem;
        z-index: 10;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 20;
      }

      #startBtn {
        padding: 1rem 2rem;
        font-size: 1.2rem;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s;
      }

      #startBtn:hover {
        background: #1d4ed8;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="score">Score: 0</div>
    <div id="overlay">
      <button id="startBtn">Start Run</button>
    </div>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

      let scene, camera, renderer, player;
      const obstacles = [];
      const laneMarkers = [];
      const laneX = [-2, 0, 2];

      const PLAYER_Z = 0;
      const LANE_MARKER_COUNT = 16;
      const LANE_MARKER_SPACING = 5;

      let currentLane = 1;
      let speed = 6;
      let gameOver = false;
      let score = 0;
      let jumpVelocity = 0;
      let isJumping = false;
      const gravity = 1.2;
      const jumpStrength = 12;
      let lastTime = 0;
      let animationRunning = false;

      function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x202020, 5, 50);

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        const ambLight = new THREE.AmbientLight(0x404040);
        scene.add(ambLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(100, 20),
          new THREE.MeshPhongMaterial({ color: 0x054d1a })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -50;
        scene.add(ground);

        const lineGeo = new THREE.PlaneGeometry(100, 0.02);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        [-1, 1].forEach((offset) => {
          const line = new THREE.Mesh(lineGeo, lineMat);
          line.rotation.x = -Math.PI / 2;
          line.position.set(offset * 2, 0.01, -50);
          scene.add(line);
        });

        createLaneMarkers();

        player = new THREE.Mesh(
          new THREE.SphereGeometry(0.5, 16, 16),
          new THREE.MeshPhongMaterial({ color: 0xffd700 })
        );
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        scene.add(player);

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      function createLaneMarkers() {
        const markerGeo = new THREE.PlaneGeometry(0.4, 1.5);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < LANE_MARKER_COUNT; i++) {
          const marker = new THREE.Mesh(markerGeo, markerMat);
          marker.rotation.x = -Math.PI / 2;
          marker.position.set(0, 0.015, -i * LANE_MARKER_SPACING);
          laneMarkers.push(marker);
          scene.add(marker);
        }
      }

      function resetLaneMarkers() {
        laneMarkers.forEach((marker, index) => {
          marker.position.z = -index * LANE_MARKER_SPACING;
        });
      }

      function scrollLaneMarkers(deltaSeconds) {
        if (!laneMarkers.length) return;
        const travel = speed * deltaSeconds;
        const minZ = -LANE_MARKER_SPACING * (laneMarkers.length - 1);
        laneMarkers.forEach((marker) => {
          marker.position.z += travel;
          if (marker.position.z > PLAYER_Z) {
            marker.position.z = minZ;
          }
        });
      }

      function spawnObstacle() {
        const idx = Math.floor(Math.random() * 3);
        const obstacle = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.8, 0.8),
          new THREE.MeshPhongMaterial({ color: 0x8b0000 })
        );
        obstacle.position.set(laneX[idx], 0.4, -50);
        obstacle.laneIndex = idx;
        obstacles.push(obstacle);
        scene.add(obstacle);
      }

      function updateObstacles(deltaSeconds) {
        const obstacleTravel = speed * 2 * deltaSeconds;
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obstacle = obstacles[i];
          obstacle.position.z += obstacleTravel;
          if (obstacle.position.z > 5) {
            scene.remove(obstacle);
            obstacles.splice(i, 1);
            score++;
          } else if (
            !gameOver &&
            obstacle.laneIndex === currentLane &&
            Math.abs(obstacle.position.z - PLAYER_Z) < 0.8 &&
            player.position.y < 1
          ) {
            gameOver = true;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('startBtn').textContent = 'Restart';
          }
        }
      }

      function animate(timestamp) {
        requestAnimationFrame(animate);
        const deltaSeconds = lastTime ? (timestamp - lastTime) / 1000 : 0;
        lastTime = timestamp;

        if (!gameOver && deltaSeconds) {
          scrollLaneMarkers(deltaSeconds);
          if (isJumping) {
            player.position.y += jumpVelocity * deltaSeconds;
            jumpVelocity -= gravity * deltaSeconds;
            if (player.position.y <= 0.5) {
              player.position.y = 0.5;
              isJumping = false;
              jumpVelocity = 0;
            }
          }
          if (Math.random() < 0.02) {
            spawnObstacle();
          }
          updateObstacles(deltaSeconds);
          document.getElementById('score').textContent = `Score: ${score}`;
        }

        renderer.render(scene, camera);
      }

      function startGame() {
        while (obstacles.length) {
          const obstacle = obstacles.pop();
          scene.remove(obstacle);
        }
        score = 0;
        gameOver = false;
        currentLane = 1;
        jumpVelocity = 0;
        isJumping = false;
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        resetLaneMarkers();
        lastTime = 0;
        document.getElementById('score').textContent = 'Score: 0';
        document.getElementById('overlay').style.display = 'none';

        if (!animationRunning) {
          animationRunning = true;
          requestAnimationFrame(animate);
        }
      }

      function moveLeft() {
        if (currentLane > 0) {
          currentLane--;
          player.position.x = laneX[currentLane];
        }
      }

      function moveRight() {
        if (currentLane < 2) {
          currentLane++;
          player.position.x = laneX[currentLane];
        }
      }

      function jump() {
        if (!isJumping) {
          isJumping = true;
          jumpVelocity = jumpStrength;
        }
      }

      document.getElementById('startBtn').addEventListener('click', startGame);

      window.addEventListener('keydown', (event) => {
        if (gameOver) return;
        if (event.key === 'ArrowLeft') {
          moveLeft();
        } else if (event.key === 'ArrowRight') {
          moveRight();
        } else if (event.key === 'ArrowUp' || event.key === ' ') {
          jump();
        }
      });

      let touchStartX;
      let touchStartY;

      window.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      });

      window.addEventListener('touchend', (event) => {
        if (gameOver) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.screenX - touchStartX;
        const deltaY = touch.screenY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX > 30) {
            moveRight();
          } else if (deltaX < -30) {
            moveLeft();
          }
        } else if (deltaY < -30) {
          jump();
        }
      });

      init();
    </script>
  </body>
</html>

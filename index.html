<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footy Run 3D</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
        background: #111;
        color: #fff;
      }

      #score {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 1.2rem;
        z-index: 10;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 20;
      }

      #startBtn {
        padding: 1rem 2rem;
        font-size: 1.2rem;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s;
      }

      #startBtn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div id="score">Score: 0</div>
    <div id="overlay">
      <button id="startBtn">Start Run</button>
    </div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

      const PLAYER_Z = 0;
      const dashSpacing = 5;
      const dashesPerLane = 20;
      const trackWrap = dashSpacing * dashesPerLane;

      let scene;
      let camera;
      let renderer;
      let player;

      const obstacles = [];
      const laneX = [-2, 0, 2];
      const laneMarkers = [];

      let currentLane = 1;
      let speed = 0.1;
      let gameOver = false;
      let score = 0;
      let jumpVelocity = 0;
      let isJumping = false;

      function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x202020, 5, 50);

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        const ambLight = new THREE.AmbientLight(0x404040);
        scene.add(ambLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(100, 20),
          new THREE.MeshPhongMaterial({ color: 0x054d1a })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -50;
        scene.add(ground);

        const lineGeo = new THREE.PlaneGeometry(100, 0.02);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        [-1, 1].forEach((offset) => {
          const line = new THREE.Mesh(lineGeo, lineMat);
          line.rotation.x = -Math.PI / 2;
          line.position.set(offset * 2, 0.01, -50);
          scene.add(line);
        });

        const dashGeo = new THREE.PlaneGeometry(0.3, 1.5);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        laneX.forEach((x) => {
          for (let i = 0; i < dashesPerLane; i += 1) {
            const dash = new THREE.Mesh(dashGeo, dashMat);
            dash.rotation.x = -Math.PI / 2;
            dash.position.set(x, 0.02, -i * dashSpacing);
            dash.userData.baseZ = -i * dashSpacing;
            laneMarkers.push(dash);
            scene.add(dash);
          }
        });

        player = new THREE.Mesh(
          new THREE.SphereGeometry(0.5, 16, 16),
          new THREE.MeshPhongMaterial({ color: 0xffd700 })
        );
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        scene.add(player);

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      function spawnObstacle() {
        const idx = Math.floor(Math.random() * 3);
        const obs = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.8, 0.8),
          new THREE.MeshPhongMaterial({ color: 0x8b0000 })
        );
        obs.position.set(laneX[idx], 0.4, -50);
        obs.laneIndex = idx;
        obstacles.push(obs);
        scene.add(obs);
      }

      function updateObstacles() {
        for (let i = obstacles.length - 1; i >= 0; i -= 1) {
          const obstacle = obstacles[i];
          obstacle.position.z += speed * 2;

          if (obstacle.position.z > 5) {
            scene.remove(obstacle);
            obstacles.splice(i, 1);
            score += 1;
            continue;
          }

          const sameLane = obstacle.laneIndex === currentLane;
          const closeInZ = Math.abs(obstacle.position.z - PLAYER_Z) < 0.8;
          const lowEnough = player.position.y < 1;

          if (!gameOver && sameLane && closeInZ && lowEnough) {
            gameOver = true;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('startBtn').textContent = 'Restart';
          }
        }
      }

      function scrollTrack() {
        laneMarkers.forEach((dash) => {
          dash.position.z += speed * 2;
          if (dash.position.z > 2) {
            dash.position.z -= trackWrap;
          }
        });
      }

      function animate() {
        if (!gameOver) {
          if (isJumping) {
            player.position.y += jumpVelocity;
            jumpVelocity -= 0.02;
            if (player.position.y <= 0.5) {
              player.position.y = 0.5;
              isJumping = false;
            }
          }

          if (Math.random() < 0.02) {
            spawnObstacle();
          }

          updateObstacles();
          scrollTrack();
          document.getElementById('score').textContent = `Score: ${score}`;
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function startGame() {
        while (obstacles.length) {
          const obs = obstacles.pop();
          scene.remove(obs);
        }

        laneMarkers.forEach((dash) => {
          dash.position.z = dash.userData.baseZ;
        });

        score = 0;
        gameOver = false;
        currentLane = 1;
        player.position.set(laneX[currentLane], 0.5, PLAYER_Z);
        player.position.y = 0.5;
        isJumping = false;
        jumpVelocity = 0;
        document.getElementById('score').textContent = 'Score: 0';
        document.getElementById('overlay').style.display = 'none';

        animate();
      }

      function moveLeft() {
        if (currentLane > 0) {
          currentLane -= 1;
          player.position.x = laneX[currentLane];
        }
      }

      function moveRight() {
        if (currentLane < 2) {
          currentLane += 1;
          player.position.x = laneX[currentLane];
        }
      }

      function jump() {
        if (!isJumping) {
          isJumping = true;
          jumpVelocity = 0.2;
        }
      }

      document.getElementById('startBtn').addEventListener('click', startGame);

      window.addEventListener('keydown', (event) => {
        if (gameOver) return;
        if (event.key === 'ArrowLeft') moveLeft();
        else if (event.key === 'ArrowRight') moveRight();
        else if (event.key === 'ArrowUp' || event.key === ' ') jump();
      });

      let touchStartX = 0;
      let touchStartY = 0;

      window.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      });

      window.addEventListener('touchend', (event) => {
        if (gameOver) return;
        const touch = event.changedTouches[0];
        const dx = touch.screenX - touchStartX;
        const dy = touch.screenY - touchStartY;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 30) moveRight();
          else if (dx < -30) moveLeft();
        } else if (dy < -30) {
          jump();
        }
      });

      init();
    </script>
  </body>
</html>

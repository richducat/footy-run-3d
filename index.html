<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Footy Run 3D</title><style>body{margin:0;overflow:hidden;font-family:sans-serif;background:#111;color:#fff}#score{position:absolute;top:10px;left:10px;font-size:1.2rem;z-index:10}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20}#startBtn{padding:1rem 2rem;font-size:1.2rem;background:#2563eb;border:none;border-radius:8px;color:#fff;cursor:pointer;transition:background.2s}#startBtn:hover{background:#1d4ed8}</style></head><body><div id=score></div><div id=overlay><button id=startBtn>Start Run</button></div><script type=module>import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';let scene,camera,renderer,player;const obstacles=[],laneX=[-2,0,2];let currentLane=1,speed=0.1,gameOver=false,score=0,jumpVelocity=0,isJumping=false;let isRunning=false;function init(){scene=new THREE.Scene();scene.fog=new THREE.Fog(0x202020,5,50);camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,100);camera.position.set(0,4,8);camera.lookAt(0,1,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(window.devicePixelRatio);document.body.appendChild(renderer.domElement);const dirLight=new THREE.DirectionalLight(0xffffff,0.8);dirLight.position.set(5,10,5);scene.add(dirLight);const ambLight=new THREE.AmbientLight(0x404040);scene.add(ambLight);const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,20),new THREE.MeshPhongMaterial({color:0x054d1a}));ground.rotation.x=-Math.PI/2;ground.position.z=-50;scene.add(ground);const lineGeo=new THREE.PlaneGeometry(100,0.02),lineMat=new THREE.MeshBasicMaterial({color:0xffffff});[-1,1].forEach(off=>{const l=new THREE.Mesh(lineGeo,lineMat);l.rotation.x=-Math.PI/2;l.position.set(off*2,0.01,-50);scene.add(l);});player=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16),new THREE.MeshPhongMaterial({color:0xffd700}));player.position.set(laneX[currentLane],0.5,0);scene.add(player);window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});animate();}function spawnObstacle(){const idx=Math.floor(Math.random()*3),obs=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8),new THREE.MeshPhongMaterial({color:0x8b0000}));obs.position.set(laneX[idx],0.4,-50);obs.laneIndex=idx;obstacles.push(obs);scene.add(obs);}function updateObstacles(){for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*2;if(o.position.z>5){scene.remove(o);obstacles.splice(i,1);score++;}else if(!gameOver&&o.laneIndex===currentLane&&Math.abs(o.position.z-player.position.z)<0.8&&player.position.y<1){gameOver=true;isRunning=false;document.getElementById('overlay').style.display='flex';document.getElementById('startBtn').textContent='Restart';}}}function animate(){if(isRunning&&!gameOver){player.position.z-=speed;if(isJumping){player.position.y+=jumpVelocity;jumpVelocity-=0.02;if(player.position.y<=0.5){player.position.y=0.5;isJumping=false;}}if(Math.random()<0.02)spawnObstacle();updateObstacles();document.getElementById('score').textContent='Score: '+score;}renderer.render(scene,camera);requestAnimationFrame(animate);}function startGame(){while(obstacles.length){const o=obstacles.pop();scene.remove(o);}score=0;gameOver=false;currentLane=1;player.position.set(laneX[currentLane],0.5,0);player.position.y=0.5;isJumping=false;jumpVelocity=0;document.getElementById('overlay').style.display='none';document.getElementById('score').textContent='Score: 0';isRunning=true;}function moveLeft(){if(currentLane>0){currentLane--;player.position.x=laneX[currentLane];}}function moveRight(){if(currentLane<2){currentLane++;player.position.x=laneX[currentLane];}}function jump(){if(!isJumping){isJumping=true;jumpVelocity=0.2;}}document.getElementById('startBtn').addEventListener('click',startGame);window.addEventListener('keydown',e=>{if(gameOver)return;if(e.key==='ArrowLeft')moveLeft();else if(e.key==='ArrowRight')moveRight();else if(e.key==='ArrowUp'||e.key===' ')jump();});let tSX,tSY;window.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tSX=t.screenX;tSY=t.screenY;});window.addEventListener('touchend',e=>{if(gameOver)return;const t=e.changedTouches[0];const dx=t.screenX-tSX,dy=t.screenY-tSY;if(Math.abs(dx)>Math.abs(dy)){if(dx>30)moveRight();else if(dx<-30)moveLeft();}else{if(dy<-30)jump();}});init();</script></body></html>

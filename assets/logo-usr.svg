<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate Striker Run Crest</title>
  <desc id="desc">Gradient football crest with motion streaks and USR wordmark above the Ultimate Striker Run title.</desc>
  <defs>
    <linearGradient id="g-tail" x1="0%" y1="50%" x2="70%" y2="50%">
      <stop offset="0%" stop-color="#13d8ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#2dfc8a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2dfc8a" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="g-ball" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffd15c" />
      <stop offset="35%" stop-color="#ff7a52" />
      <stop offset="65%" stop-color="#ff3b7a" />
      <stop offset="100%" stop-color="#7d4fff" />
    </radialGradient>
    <linearGradient id="g-outline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dfc8a" />
      <stop offset="100%" stop-color="#15d8ff" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#051024" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050b18" rx="48" ry="48" />

  <g filter="url(#shadow)" transform="translate(30,46)">
    <g fill="url(#g-tail)">
      <path d="M0 152c50-16 110-24 170-20-62-8-120 0-170 20z" opacity="0.75" />
      <path d="M6 194c64-24 136-32 208-24-72-6-146 4-208 24z" opacity="0.55" />
      <path d="M18 234c70-30 158-40 246-28-90-6-174 6-246 28z" opacity="0.35" />
    </g>

    <g transform="translate(100,70)">
      <circle cx="152" cy="152" r="140" fill="#091325" />
      <circle cx="152" cy="152" r="132" fill="url(#g-ball)" stroke="url(#g-outline)" stroke-width="12" />
      <g fill="#0f0c21" opacity="0.85">
        <path d="M152 56l36 24-12 40h-48l-12-40z" />
        <path d="M90 98l-12 48 34 30 36-24-10-46z" />
        <path d="M214 98l-46 12-10 46 36 24 34-30z" />
        <path d="M118 192l-36 24 22 56h46l12-40z" />
        <path d="M186 192l-12 40 12 40h46l22-56z" />
      </g>
      <circle cx="152" cy="152" r="132" fill="none" stroke="rgba(18,30,52,0.65)" stroke-width="12" />
    </g>
  </g>

  <g transform="translate(36,332)">
    <path
      d="M78 0h320c20 0 30 14 24 30l-12 34c-3 10-10 18-24 18H46c-24 0-34-18-28-36l12-32C36 8 58 0 78 0z"
      fill="#061126"
      stroke="url(#g-outline)"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <text
      x="238"
      y="52"
      font-family="'Space Grotesk','Inter','Poppins',system-ui"
      font-weight="800"
      font-size="118"
      text-anchor="middle"
      fill="#e8f6ff"
      stroke="#050d1a"
      stroke-width="8"
      paint-order="stroke"
    >USR</text>
  </g>

  <g transform="translate(64,436)" font-family="'Inter','Space Grotesk',system-ui" font-weight="800" fill="#f6fbff">
    <text x="192" y="24" font-size="44" text-anchor="middle" letter-spacing="1">ULTIMATE</text>
    <text x="192" y="68" font-size="44" text-anchor="middle" letter-spacing="1">STRIKER RUN</text>
  </g>
</svg>

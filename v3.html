<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Striker Run 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,800;1,900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Exo 2', sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #0ff;
            padding: 10px 20px;
            border-radius: 8px;
            transform: skewX(-10deg);
        }

        .stat-label { font-size: 12px; color: #aaa; }
        .stat-value { font-size: 24px; font-weight: 800; color: #fff; }

        /* Menus */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-size: 60px;
            color: #fff;
            font-style: italic;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            text-shadow: 4px 4px 0px #00f, -2px -2px 0 #f0f;
        }

        .btn {
            background: linear-gradient(45deg, #ff00de, #00ffcc);
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transform: skewX(-10deg);
            transition: transform 0.1s;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .btn:hover { transform: skewX(-10deg) scale(1.1); }
        .btn:active { transform: skewX(-10deg) scale(0.95); }

        /* Shot Meter */
        #shot-meter-container {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 30px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            display: none;
        }

        #shot-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, red 0%, yellow 45%, #0f0 50%, yellow 55%, red 100%);
        }

        #shot-needle {
            position: absolute;
            top: 0;
            left: 0%;
            width: 4px;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 5px #fff;
        }

        #message-area {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #ff00de;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box">
                <div class="stat-label">Distance</div>
                <div class="stat-value"><span id="score-dist">0</span>m</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Goals</div>
                <div class="stat-value" id="score-goals">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Coins</div>
                <div class="stat-value" id="score-coins">0</div>
            </div>
        </div>

        <div id="shot-meter-container">
            <div id="shot-bar"></div>
            <div id="shot-needle"></div>
        </div>

        <div id="message-area">GOAL!</div>
    </div>

    <div id="start-screen" class="menu-screen">
        <h1>Ultimate Striker Run</h1>
        <p style="color:#ccc; margin-bottom: 30px;">A Neon-Fast Football Runner</p>
        <button class="btn" onclick="startGame()">KICK OFF</button>
        <p style="color:#888; margin-top: 20px; font-size: 14px;">Arrows to Move/Jump • Space to Shoot</p>
    </div>

    <div id="game-over-screen" class="menu-screen hidden">
        <h1 style="font-size: 50px; color: #ff3333;">Full Time</h1>
        <div style="display:flex; gap: 20px; margin-bottom: 30px;">
            <div class="stat-box" style="text-align:center">
                <div class="stat-label">Total Dist</div>
                <div class="stat-value" id="final-dist">0m</div>
            </div>
            <div class="stat-box" style="text-align:center">
                <div class="stat-label">Coins</div>
                <div class="stat-value" id="final-coins">0</div>
            </div>
        </div>
        <button class="btn" onclick="resetGame()">Replay Match</button>
    </div>

<script>
    // --- Configuration ---
    const CONFIG = {
        laneWidth: 3,
        speed: 0.4,
        maxSpeed: 0.8,
        speedIncrement: 0.0005,
        jumpHeight: 2.5,
        gravity: 0.12,
        colors: {
            ground: 0x111122,
            line: 0x00ffcc,
            player: 0xff00de,
            coin: 0xffd700,
            obstacle: 0xff3333,
            goal: 0xffffff
        }
    };

    // --- Global Variables ---
    let scene, camera, renderer;
    let player, playerMesh;
    let ground, gridHelper;
    let objects = []; // Obstacles, coins
    let particles = [];
    let isPlaying = false;
    let isGameOver = false;
    let frameId;
    let distance = 0;
    let coins = 0;
    let goals = 0;
    
    // Player State
    let currentLane = 0; // -1, 0, 1
    let targetX = 0;
    let verticalVelocity = 0;
    let isJumping = false;

    // Shooting State
    let goalMode = false;
    let goalObject = null;
    let shotNeedlePos = 0;
    let shotNeedleSpeed = 2;
    
    // DOM Elements
    const uiDist = document.getElementById('score-dist');
    const uiCoins = document.getElementById('score-coins');
    const uiGoals = document.getElementById('score-goals');
    const shotContainer = document.getElementById('shot-meter-container');
    const shotNeedle = document.getElementById('shot-needle');
    const msgArea = document.getElementById('message-area');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvas-container');
        
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.03);

        // Camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, -5);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground (Infinite scrolling illusion via texture offset, but here we move objects)
        const planeGeo = new THREE.PlaneGeometry(100, 200);
        const planeMat = new THREE.MeshPhongMaterial({ 
            color: CONFIG.colors.ground,
            emissive: 0x000022
        });
        ground = new THREE.Mesh(planeGeo, planeMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -50;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid Lines (The "Pitch" markings)
        const gridGeo = new THREE.GridHelper(100, 40, CONFIG.colors.line, 0x222244);
        gridGeo.position.y = 0.05;
        gridGeo.position.z = -50;
        gridGeo.scale.z = 2;
        scene.add(gridGeo);

        createPlayer();

        // Listeners
        window.addEventListener('resize', onWindowResize, false);
        document.addEventListener('keydown', handleInput);
        
        animate();
    }

    function createPlayer() {
        player = new THREE.Group();
        
        // Body (Jersey)
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.player });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.2;
        body.castShadow = true;
        player.add(body);

        // Head
        const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.0;
        head.castShadow = true;
        player.add(head);

        // Legs (Simple animation simulation)
        const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.3);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.25, 0.4, 0);
        leftLeg.name = "leftLeg";
        player.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.25, 0.4, 0);
        rightLeg.name = "rightLeg";
        player.add(rightLeg);

        scene.add(player);
        playerMesh = player;
    }

    function spawnObject() {
        if(goalMode) return; // Don't spawn clutter during goal sequence

        const rand = Math.random();
        const zPos = -100; // Spawn far ahead
        
        // 5% chance to spawn a goal trigger
        if (rand > 0.98 && !goalMode) {
            startGoalSequence(zPos);
            return;
        }

        const laneChoice = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
        const xPos = laneChoice * CONFIG.laneWidth;

        if (rand < 0.3) {
            // Coin
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            geo.rotateX(Math.PI/2);
            const mat = new THREE.MeshPhongMaterial({ color: CONFIG.colors.coin, emissive: 0xaa8800 });
            const coin = new THREE.Mesh(geo, mat);
            coin.position.set(xPos, 1, zPos);
            coin.type = 'coin';
            coin.rotation.y = Math.random() * Math.PI;
            scene.add(coin);
            objects.push(coin);
        } else {
            // Obstacle (Defender)
            const geo = new THREE.BoxGeometry(1.5, 2, 0.5);
            const mat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.obstacle });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set(xPos, 1, zPos);
            obs.type = 'obstacle';
            obs.castShadow = true;
            scene.add(obs);
            objects.push(obs);
        }
    }

    function startGoalSequence(zStart) {
        goalMode = true;
        
        // Create Goal Structure
        const goalGroup = new THREE.Group();
        
        // Frame
        const frameGeo = new THREE.BoxGeometry(12, 4, 1);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xaaaaaa });
        const topBar = new THREE.Mesh(frameGeo, frameMat);
        topBar.position.set(0, 4, 0);
        goalGroup.add(topBar);
        
        const postGeo = new THREE.BoxGeometry(1, 4, 1);
        const leftPost = new THREE.Mesh(postGeo, frameMat);
        leftPost.position.set(-5.5, 2, 0);
        goalGroup.add(leftPost);
        const rightPost = new THREE.Mesh(postGeo, frameMat);
        rightPost.position.set(5.5, 2, 0);
        goalGroup.add(rightPost);

        // Net
        const netGeo = new THREE.PlaneGeometry(10, 4);
        const netMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true, opacity: 0.5, transparent: true });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(0, 2, 0.5);
        goalGroup.add(net);

        goalGroup.position.set(0, 0, zStart);
        goalGroup.type = 'goal';
        scene.add(goalGroup);
        objects.push(goalGroup);
        goalObject = goalGroup;

        // Show UI
        showMessage("SHOOTING CHANCE!");
        setTimeout(() => {
            if(!isGameOver) {
                shotContainer.style.display = 'block';
                shotNeedlePos = 0;
            }
        }, 1000);
    }

    // --- Game Logic ---
    function handleInput(e) {
        if (!isPlaying && e.code === 'Space') {
            // startGame(); // Handled by button
            return;
        }
        if (!isPlaying || isGameOver) return;

        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
            if (currentLane > -1) currentLane--;
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') {
            if (currentLane < 1) currentLane++;
        }
        if ((e.code === 'ArrowUp' || e.code === 'KeyW') && !isJumping) {
            verticalVelocity = 0.35;
            isJumping = true;
        }
        if (e.code === 'Space' && goalMode && shotContainer.style.display === 'block') {
            takeShot();
        }
    }

    function takeShot() {
        shotContainer.style.display = 'none';
        
        // Check accuracy (Needle moves 0-100)
        // Center is 50. Good range 40-60.
        const hit = (shotNeedlePos > 40 && shotNeedlePos < 60);

        if (hit) {
            goals++;
            coins += 50;
            uiGoals.innerText = goals;
            uiCoins.innerText = coins;
            showMessage("GOAL!!!", "#0f0");
            createParticles(0, 2, goalObject.position.z + 5, 0x00ff00, 20);
        } else {
            showMessage("MISS!", "#f00");
        }

        // Reset goal mode shortly after
        setTimeout(() => {
            goalMode = false;
            goalObject = null;
        }, 1000);
    }

    function showMessage(text, color="#fff") {
        msgArea.innerText = text;
        msgArea.style.color = color;
        msgArea.style.opacity = 1;
        msgArea.style.transform = "scale(1.5)";
        
        setTimeout(() => {
            msgArea.style.opacity = 0;
            msgArea.style.transform = "scale(1)";
        }, 1500);
    }

    function createParticles(x, y, z, color, count) {
        const geo = new THREE.BufferGeometry();
        const positions = [];
        const velocities = [];

        for(let i=0; i<count; i++) {
            positions.push(x, y, z);
            velocities.push(
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5
            );
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color: color, size: 0.2 });
        const sys = new THREE.Points(geo, mat);
        sys.userData = { velocities: velocities };
        scene.add(sys);
        particles.push(sys);
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            const positions = p.geometry.attributes.position.array;
            const vels = p.userData.velocities;

            for(let j=0; j<positions.length; j+=3) {
                positions[j] += vels[j];
                positions[j+1] += vels[j+1];
                positions[j+2] += vels[j+2];
            }
            p.geometry.attributes.position.needsUpdate = true;
            
            p.material.opacity -= 0.02;
            if(p.material.opacity <= 0) {
                scene.remove(p);
                particles.splice(i, 1);
            }
        }
    }

    function updatePlayer() {
        // Lateral Movement
        targetX = currentLane * CONFIG.laneWidth;
        player.position.x += (targetX - player.position.x) * 0.2;
        
        // Tilt effect
        player.rotation.z = (player.position.x - targetX) * 0.1;
        player.rotation.x = 0.1; // Lean forward

        // Jumping
        if (isJumping) {
            player.position.y += verticalVelocity;
            verticalVelocity -= CONFIG.gravity;
            if (player.position.y <= 0) {
                player.position.y = 0;
                isJumping = false;
            }
        }

        // Running Animation (Legs)
        const time = Date.now() * 0.015;
        const leftLeg = player.getObjectByName('leftLeg');
        const rightLeg = player.getObjectByName('rightLeg');
        if (!isJumping) {
            leftLeg.rotation.x = Math.sin(time) * 0.8;
            rightLeg.rotation.x = Math.sin(time + Math.PI) * 0.8;
        } else {
            leftLeg.rotation.x = 0.5;
            rightLeg.rotation.x = -0.5;
        }
    }

    function updateGame() {
        // Move objects towards player
        const speed = CONFIG.speed;
        
        // Distance update
        distance += speed;
        uiDist.innerText = Math.floor(distance);

        // Spawn logic
        if (Math.random() < 0.05) spawnObject();

        // Update objects
        for (let i = objects.length - 1; i >= 0; i--) {
            const obj = objects[i];
            obj.position.z += speed;

            // Rotation for coins
            if (obj.type === 'coin') obj.rotation.y += 0.1;

            // Collision Detection
            const dz = obj.position.z - player.position.z;
            const dx = obj.position.x - player.position.x;
            
            // Simple bounding box check
            if (Math.abs(dz) < 1.0) {
                if (obj.type === 'coin') {
                    if (Math.abs(dx) < 1.0 && player.position.y < 2) {
                        // Collect
                        coins++;
                        uiCoins.innerText = coins;
                        createParticles(obj.position.x, obj.position.y, obj.position.z, 0xffff00, 10);
                        scene.remove(obj);
                        objects.splice(i, 1);
                        continue;
                    }
                } else if (obj.type === 'obstacle') {
                    if (Math.abs(dx) < 0.8 && player.position.y < 1.5) {
                        gameOver();
                    }
                } else if (obj.type === 'goal') {
                    // Passed the goal
                }
            }

            // Cleanup
            if (obj.position.z > 10) {
                scene.remove(obj);
                objects.splice(i, 1);
            }
        }
        
        // Shot Meter Logic
        if (goalMode && shotContainer.style.display === 'block') {
            shotNeedlePos += shotNeedleSpeed;
            if (shotNeedlePos > 100 || shotNeedlePos < 0) shotNeedleSpeed *= -1;
            shotNeedle.style.left = shotNeedlePos + '%';
        }
    }

    function animate() {
        frameId = requestAnimationFrame(animate);

        if (isPlaying && !isGameOver) {
            updatePlayer();
            updateGame();
            updateParticles();
        }

        renderer.render(scene, camera);
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        isPlaying = true;
        isGameOver = false;
        distance = 0;
        coins = 0;
        goals = 0;
        
        // Reset Scene Objects
        objects.forEach(o => scene.remove(o));
        objects = [];
        
        // Reset Player
        currentLane = 0;
        player.position.set(0, 0, 0);
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('final-dist').innerText = Math.floor(distance) + "m";
        document.getElementById('final-coins').innerText = coins;
        document.getElementById('game-over-screen').classList.remove('hidden');
        shotContainer.style.display = 'none';
    }

    function resetGame() {
        document.getElementById('game-over-screen').classList.add('hidden');
        startGame();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Init
    init();

</script>
</body>
</html>
